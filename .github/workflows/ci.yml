name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build & Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Kotlin/Native macOS targets are skipped on Linux; JVM tests + the
      # 80% line-coverage gate (Kover) run here.
      - name: Quality gates (tests, coverage report + 80% verification)
        run: ./gradlew check koverHtmlReport --continue

      - name: Verify the CLI entry point
        run: |
          ./gradlew fatJar
          java -jar build/libs/tcx-to-csv-all.jar --help

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: build/reports/tests
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kover-report
          path: build/reports/kover
          if-no-files-found: ignore
          retention-days: 14

  macos:
    name: Build macOS native binaries
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache Kotlin/Native compiler
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: konan-

      - name: Build macOS binaries (arm64 + x86_64)
        run: ./gradlew macosArm64Binaries macosX64Binaries --console=plain

      - name: Smoke test the arm64 binary
        run: |
          echo "--- build/bin contents ---"
          find build/bin -type f | sort || true
          BIN=$(find build/bin -type f -path '*macosArm64*' \( -name '*.kexe' -o -name 'tcx-to-csv*' \) ! -path '*.dSYM*' | grep release | head -1)
          if [ -z "$BIN" ]; then
            BIN=$(find build/bin -type f -path '*macosArm64*' \( -name '*.kexe' -o -name 'tcx-to-csv*' \) ! -path '*.dSYM*' | head -1)
          fi
          if [ -z "$BIN" ]; then echo "No macOS arm64 binary was produced" >&2; exit 1; fi
          echo "Testing $BIN"
          test -x "$BIN"
          "$BIN" --help
          cat > /tmp/smoke.tcx <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <TrainingCenterDatabase xmlns="http://www.garmin.com/xmlschemas/TrainingCenterDatabase/v2">
            <Activities><Activity Sport="Running"><Id>2026-11-21T09:00:00Z</Id>
              <Lap StartTime="2026-11-21T09:00:00Z"><TotalTimeSeconds>2</TotalTimeSeconds><Track>
                <Trackpoint><Time>2026-11-21T09:00:00Z</Time><DistanceMeters>0.0</DistanceMeters><HeartRateBpm><Value>120</Value></HeartRateBpm></Trackpoint>
                <Trackpoint><Time>2026-11-21T09:00:01Z</Time><DistanceMeters>3.1</DistanceMeters><HeartRateBpm><Value>121</Value></HeartRateBpm></Trackpoint>
              </Track></Lap>
            </Activity></Activities>
          </TrainingCenterDatabase>
          EOF
          OUT=$("$BIN" /tmp/smoke.tcx)
          echo "$OUT"
          test "$(echo "$OUT" | wc -l | tr -d ' ')" = "3"

      - name: Upload macOS binaries
        uses: actions/upload-artifact@v7
        with:
          name: tcx-to-csv-macos
          path: build/bin
          if-no-files-found: error
          retention-days: 30
